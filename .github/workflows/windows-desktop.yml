name: Windows desktop

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Test desktop app on Windows
        run: npm run test:desktop
      - name: Build Windows installer
        run: npm run build:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Test packaged Windows executable
        run: npm run test:desktop
        env:
          LUMENFALL_EXECUTABLE: ${{ github.workspace }}\dist\win-unpacked\Lumenfall.exe
      - name: Generate download checksum
        shell: pwsh
        run: |
          Get-ChildItem dist/*-Setup.exe | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Out-File -FilePath dist/SHA256SUMS.txt -Encoding ascii
          }
      - uses: actions/upload-artifact@v4
        with:
          name: Lumenfall-Windows-x64
          path: |
            dist/*-Setup.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
      - name: Publish tagged desktop release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $installer = (Get-ChildItem dist/*-Setup.exe).FullName
          gh release create $env:GITHUB_REF_NAME $installer ./dist/SHA256SUMS.txt --verify-tag --title "微光之境 $env:GITHUB_REF_NAME · Windows 桌面版" --notes-file desktop/RELEASE_NOTES.md
